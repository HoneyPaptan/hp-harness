name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check tag
        run: |
          set -eu
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: go test ./...
      - name: Cross build
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/hp-$os-$arch/hp" ./cmd/hp
            tar -czf "dist/hp-$os-$arch.tar.gz" -C "dist/hp-$os-$arch" hp
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hp-linux-amd64.tar.gz dist/hp-linux-arm64.tar.gz \
            dist/hp-darwin-amd64.tar.gz dist/hp-darwin-arm64.tar.gz \
            dist/checksums.txt \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
