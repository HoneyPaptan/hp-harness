<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hp</title>
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a class="brand" id="home" href="#">hp</a>
    <span class="bar-sep" aria-hidden="true">/</span>
    <nav class="bar-nav" aria-label="Main">
      <button class="nav" id="menu" type="button" aria-expanded="false" aria-controls="rail">runs</button>
      <button class="nav" id="new-run-bar" type="button">new</button>
    </nav>
  </header>
  <aside class="rail" id="rail" aria-label="Runs">
    <div class="rail-head">
      <span class="t-meta">runs</span>
      <button class="nav" id="new-run" type="button">new run</button>
    </div>
    <nav class="rail-list" aria-label="Run history">
      <div class="hover-mark" id="hover-mark" aria-hidden="true"></div>
      <ul id="runs"></ul>
      <p class="rail-empty t-meta" id="runs-empty" hidden>No runs yet.</p>
    </nav>
    <p class="rail-foot t-meta" id="dir"></p>
  </aside>
  <button class="scrim" id="scrim" type="button" tabindex="-1" aria-label="Close runs"></button>
  <main class="main" id="main">
    <h1 class="sr-only">hp</h1>
    <div class="thread" id="thread" tabindex="0" role="region" aria-label="Transcript">
      <div class="column">
        <p class="intro t-meta" id="intro"><span class="intro-name">hp</span> <span id="version"></span> · Run /help for commands</p>
        <div id="transcript"></div>
      </div>
    </div>
    <div class="dock" id="dock">
      <button class="jump nav" id="jump" type="button" hidden>jump to latest</button>
      <p class="conn t-meta" id="conn" hidden>reconnecting…</p>
      <p class="notice" id="notice" hidden></p>
      <form class="composer" id="composer" novalidate>
        <span class="caret-glyph" aria-hidden="true">›</span>
        <label class="sr-only" for="prompt">Message</label>
        <textarea id="prompt" rows="1" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea>
      </form>
      <div class="footer">
        <p class="footer-line t-meta" id="footer"></p>
        <button class="nav send" id="send" type="submit" form="composer" data-mode="send" disabled>send</button>
      </div>
    </div>
    <div class="sr-only" id="live" role="status" aria-live="polite"></div>
  </main>
</div>
</body>
</html>
